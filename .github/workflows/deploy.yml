name: Deploy to GitHub Pages

# The content lives in the EduardoTBuss repository, not here, so this site is
# also rebuilt on a schedule: that is how a change to the data over there shows
# up over here without any cross-repository token.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Check out the canonical data
        uses: actions/checkout@v4
        with:
          repository: EduardoTBuss/EduardoTBuss
          path: profile-repo

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Copy the data into the build
        run: npm run sync:data
        env:
          DATA_SOURCE: profile-repo/data

      - name: Validate the project pages
        run: npm run check

      - run: npm run build

      - name: Enforce the page weight budget
        run: npm run budget

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
